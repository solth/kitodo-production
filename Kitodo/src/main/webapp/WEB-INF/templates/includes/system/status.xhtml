<ui:composition
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui">

    <!--@elvariable id="systemComponent" type="org.kitodo.production.helper.SystemComponent"-->
    <p:dataTable id="componentTable"
                 rows="#{SystemStatus.components.size()}"
                 value="#{SystemStatus.components}"
                 var="systemComponent"
                 rowStyleClass="#{systemComponent.configured ? '' : 'deactivated'}">
        <p:column headerText="#{msgs.component}"
                  id="componentName">
            <h:outputText value="#{systemComponent.componentName}"/>
        </p:column>
        <p:column headerText="#{msgs.version}"
                  id="componentVersion">
            <h:outputText value="#{systemComponent.componentVersion}"/>
        </p:column>
        <p:column headerText="#{msgs.status}"
                  id="componentStatus">
            <h:outputText value="#{systemComponent.componentHealth} #{systemComponent.componentInformation}"/>
        </p:column>
    </p:dataTable>

    <h:form id="statusUpdateForm">
        <p:commandButton id="updateStatusButton"
                         style="margin: var(--default-full-size)"
                         action="#{SystemStatus.updateStatus()}"
                         update="systemTabView:componentTable"
                         value="#{msgs.update}"/>
    </h:form>

</ui:composition>
